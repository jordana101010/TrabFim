<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeeg2</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>
<body>
    <!-- Cabeçalho da página -->
    <header id="inicio">
        <div class="container-fluid p-3 mb-2 bg-danger-subtle text-danger-emphasis">
            <br>
            <!-- IMAGEM DA LOGO -->
            <div>
                <img src="../img/LOGO.jpg" alt="Logo" class="rounded mx-auto d-block img-fluid w-25">
            </div>
            <br>
            <!-- NOME SKEEG2 -->
            <div>
                <h1 class="display-3 font-monospace text-center">Skeeg2</h1>
            </div>
            <br>
            <!-- MENU -->
            <div class="d-flex justify-content-center">
                <!-- Pronto do Bootstrap -->
                <!-- Menu adaptado para navegar pelas seções da página -->
                <ul class="nav nav-pills mb-3" style="--bs-nav-pills-link-active-bg: #2d2d2e; --bs-nav-pills-link-active-color: #ffffff; --bs-nav-link-color: #000000; --bs-nav-link-hover-color: #000000;">
                    <li class="nav-item">
                        <a class="nav-link active" href="#conteudos">Principais Conteúdos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#planos">Planos de Assinatura</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#cadastre">Cadastre-se</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contato">Contato</a>
                    </li>
                </ul>
            </div>
            <br><br>
        </div>
    </header>
   <!-- Código de carrossel Bootstrap -->
    <div class="container-fluid mb-2 bg-dark-subtle text-dark-emphasis" id="conteudos">
        <!-- Título container -->
        <br>
        <h3 class="text-center">PRINCIPAIS CONTEÚDOS SKEEG2</h3>
        <br>
        <!-- Carrosel de imagens -->
        <div class="col-12 col-md-8 col-lg-7 mx-auto shadow-lg rounded-5 overflow-hidden">
            <div id="carouselExampleInterval" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="10000">
                        <img src="../img/frieren.jpg" class="d-block w-100" style="height: 350px; object-fit: cover;" alt="Frieren">
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="../img/spy.jpg" class="d-block w-100" style="height: 350px; object-fit: cover;" alt="Spy x Family">
                    </div>
                    <div class="carousel-item">
                        <img src="../img/death.jpg" class="d-block w-100" style="height: 350px; object-fit: cover;" alt="Death Note">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleInterval" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                </button>
            </div>
        </div>
        <br>
    </div>
    <!-- Planos -->
    <div class="container-fluid mb-2 text-center bg-danger-subtle" id="planos">
        <br>
        <div class="row d-flex justify-content-center">
            <div class="col-3 border border-danger-subtle border-2">
                <h3>Plano Pessoal - 1 tela</h3>
            </div>
            <div class="col-5 border border-danger-subtle border-2">
                <h4>R$25,00 mensais</h4>
            </div>
        </div>
        <br>
        <div class="row d-flex justify-content-center">
            <div class="col-3 border border-danger-subtle border-2">
                <h3>Plano família - Até 5 telas</h3>
            </div>
            <div class="col-5 border border-danger-subtle border-2">
                <h4>R$70,00 mensais</h4>
            </div>
        </div>
        <br>
    </div>
    <script type="text/javascript" src="../js/bootstrap.bundle.min.js"></script> 
</body>
</html>
